name: Publish fork images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hybrid-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Mitalca5/AutoLedger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish application
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mitalca5/autoledger:hybrid
            ghcr.io/mitalca5/autoledger:hybrid-${{ github.sha }}
          build-args: |
            APP_VERSION=hybrid-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Mitalca5/AutoLedger
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hybrid-app
          cache-to: type=gha,mode=max,scope=hybrid-app
      - name: Build and publish backup service
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./backup
          file: ./backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mitalca5/autoledger-backup:hybrid
            ghcr.io/mitalca5/autoledger-backup:hybrid-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Mitalca5/AutoLedger
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hybrid-backup
          cache-to: type=gha,mode=max,scope=hybrid-backup
